quarkus.http.port=8087

# HU-01 onboarding: rechazar campos desconocidos y limitar el tamaño del cuerpo
quarkus.jackson.fail-on-unknown-properties=true
quarkus.http.limits.max-body-size=16K

# Ruta ilustrativa del punto de entrada de pagos de bajo monto (valor real a acordar con HU-02)
onboarding.payments-entry-point=/payments/new

# HU-02 pagos. SIN valores por defecto inventados:
#  - payments.pending-expiration es OBLIGATORIA fuera de dev/test (pregunta abierta P8 de Producto).
#  - Un combo proveedor/canal sin payments.limits.<providerId>.<channel>.max-amount es "no soportado" (P9).
# Los valores siguientes son SOLO de demostración/pruebas, NO son reglas de negocio ni umbrales de "monto bajo".
%dev.payments.pending-expiration=PT2M
%dev.payments.limits.mock-provider-a.ALIAS.max-amount=500.00
%test.payments.pending-expiration=PT5M
%test.payments.limits.mock-provider-a.ALIAS.max-amount=500.00
