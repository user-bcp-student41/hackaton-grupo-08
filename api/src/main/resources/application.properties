quarkus.http.port=8087

# HU-01 onboarding: rechazar campos desconocidos y limitar el tamaño del cuerpo
quarkus.jackson.fail-on-unknown-properties=true
quarkus.http.limits.max-body-size=16K

# Ruta ilustrativa del punto de entrada de pagos de bajo monto (valor real a acordar con HU-02)
onboarding.payments-entry-point=/payments/new

# HU-01 registro/autenticación. VALORES PROVISIONALES (P6 sin respuesta): Producto/Seguridad deben confirmarlos.
registration.hash.iterations=120000
registration.otp.length=6
registration.otp.ttl-seconds=300
registration.otp.max-attempts=5
registration.otp.max-resends=3
auth.session-ttl-seconds=3600
auth.max-failed-logins=5
auth.lockout-seconds=300
# X-User-Id y buzón del OTP simulado solo fuera de producción
auth.legacy-user-id-header=false
registration.mailbox.enabled=false
%dev.registration.mailbox.enabled=true
%dev.auth.legacy-user-id-header=true
%test.registration.mailbox.enabled=true
%test.auth.legacy-user-id-header=true
%test.registration.hash.iterations=1000
%test.auth.max-failed-logins=3
